<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿丹時光膠囊</title>
    <style>
        :root {
            --primary-color: #007aff;
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(180deg, #1c1c1e 0%, #000000 100%);
        }

        h1 {
            font-size: 28px;
            margin: 0;
            letter-spacing: 1px;
        }

        .status-bar {
            font-size: 14px;
            color: var(--primary-color);
            margin-top: 10px;
            font-weight: 500;
        }

        #adan-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
        }

        .gallery-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #38383a;
            transition: transform 0.2s;
        }

        .gallery-item:active {
            transform: scale(0.98);
        }

        .file-name {
            color: var(--primary-color);
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .file-info {
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.6;
        }

        .loading-spinner {
            margin-top: 50px;
            color: var(--text-sub);
        }

        .empty-state {
            margin-top: 100px;
            text-align: center;
            color: var(--text-sub);
        }

        hr {
            border: 0;
            border-top: 1px solid #38383a;
            margin: 12px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>阿丹時光膠囊</h1>
        <div id="status" class="status-bar">連線基地中...</div>
    </header>

    <div id="adan-gallery">
        </div>

    <div id="loading" class="loading-spinner">正在解鎖膠囊...</div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        async function initAdan() {
            const statusEl = document.getElementById('status');
            const galleryEl = document.getElementById('adan-gallery');
            const loadingEl = document.getElementById('loading');

            try {
                // 1. 初始化 LIFF
                await liff.init({ liffId: "2009633088-LqIEGiJZ" });

                // 2. 檢查登入
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                // 3. 獲取 Profile 並請求 Worker
                const profile = await liff.getProfile();
                statusEl.innerText = `歡迎回來，${profile.displayName}`;
                
                const response = await fetch(`https://roger9527.hanknah02.workers.dev?userId=${profile.userId}`);
                if (!response.ok) throw new Error('基地連線失敗');
                
                const files = await response.json();
                loadingEl.style.display = 'none';

                // 4. 渲染檔案列表
                if (files && files.length > 0) {
                    files.forEach(file => {
                        const card = document.createElement('div');
                        card.className = 'gallery-item';
                        card.innerHTML = `
                            <div class="file-name">📄 ${file.name}</div>
                            <hr>
                            <div class="file-info">
                                ⚖️ 檔案大小：${file.size}<br>
                                📅 存入時間：${file.date}
                            </div>
                        `;
                        galleryEl.appendChild(card);
                    });
                } else {
                    galleryEl.innerHTML = '<div class="empty-state">目前膠囊裡還沒有回憶喔！<br>趕快傳個檔案給阿丹吧 🚀</div>';
                }

            } catch (err) {
                console.error(err);
                statusEl.innerText = "❌ 基地連線發生錯誤";
                loadingEl.innerText = "請確認 Worker 網址與設定是否正確。";
            }
        }

        window.onload = initAdan;
    </script>
</body>
</html>
