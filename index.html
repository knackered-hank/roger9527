<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿丹時光膠囊</title>
    <style>
        :root { --primary-color: #007aff; --bg-color: #000; --card-bg: #1c1c1e; --text-main: #fff; --text-sub: #8e8e93; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; padding: 40px 20px; text-align: center; background: linear-gradient(180deg, #1c1c1e 0%, #000 100%); }
        .status-bar { font-size: 14px; color: var(--primary-color); margin-top: 10px; }
        #adan-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; width: 100%; max-width: 1200px; padding: 20px; box-sizing: border-box; }
        .gallery-item { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid #38383a; }
        .file-name { color: var(--primary-color); font-weight: 600; margin-bottom: 8px; word-break: break-all; }
        .file-info { font-size: 12px; color: var(--text-sub); line-height: 1.6; }
        .loading { margin-top: 50px; color: var(--text-sub); }
        hr { border: 0; border-top: 1px solid #38383a; margin: 12px 0; }
    </style>
</head>
<body>
    <header>
        <h1>阿丹時光膠囊</h1>
        <div id="status" class="status-bar">基地連線中...</div>
    </header>

    <div id="adan-gallery"></div>
    <div id="loading" class="loading">正在解鎖膠囊...</div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        async function initAdan() {
            const statusEl = document.getElementById('status');
            const galleryEl = document.getElementById('adan-gallery');
            const loadingEl = document.getElementById('loading');

            try {
                // 1. 初始化 LIFF (使用你的 ID)
                await liff.init({ liffId: "2009633088-LqIEGiJZ" });

                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                statusEl.innerText = `歡迎回來，${profile.displayName}`;

                // 2. 請求 Worker 資料 (確認網址正確)
                const workerUrl = `https://roger9527.hanknah02.workers.dev?userId=${profile.userId}`;
                const response = await fetch(workerUrl);
                
                if (!response.ok) throw new Error('基地連線失敗');
                
                const files = await response.json();
                loadingEl.style.display = 'none';

                // 3. 渲染
                if (files && files.length > 0) {
                    files.forEach(file => {
                        const card = document.createElement('div');
                        card.className = 'gallery-item';
                        card.innerHTML = `
                            <div class="file-name">📄 ${file.name}</div>
                            <hr>
                            <div class="file-info">⚖️ 檔案大小：${file.size}<br>📅 存入時間：${file.date}</div>
                        `;
                        galleryEl.appendChild(card);
                    });
                } else {
                    galleryEl.innerHTML = '<div style="text-align:center;width:100%;color:#8e8e93;margin-top:100px;">目前膠囊裡還沒有回憶喔！🚀</div>';
                }
            } catch (err) {
                statusEl.innerText = "❌ 基地連線發生錯誤";
                loadingEl.innerText = "錯誤訊息：" + err.message;
            }
        }
        window.onload = initAdan;
    </script>
</body>
</html>
