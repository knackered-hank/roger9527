<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>阿丹時光膠囊</title>
    <meta property="og:title" content="時光膠囊小精靈">
    <meta property="og:description" content="你的專屬秘密基地，守護每一份珍貴回憶。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://images.unsplash.com/photo-1516534775068-ba3e84529519?q=80&w=500&auto=format&fit=crop">
    
    <style>
        :root { --primary-color: #007aff; --bg-color: #000; --card-bg: #1c1c1e; --text-main: #fff; --text-sub: #8e8e93; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; padding: 30px 20px; text-align: center; background: #1c1c1e; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #38383a; box-sizing: border-box; }
        .status-bar { font-size: 13px; color: var(--primary-color); margin-top: 8px; }
        #adan-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; width: 100%; max-width: 1000px; padding: 20px; box-sizing: border-box; }
        .gallery-item { background: var(--card-bg); border-radius: 12px; padding: 15px; border: 1px solid #38383a; text-align: center; cursor: pointer; transition: 0.2s; }
        .gallery-item:active { background: #2c2c2e; transform: scale(0.98); }
        .file-icon { font-size: 32px; margin-bottom: 8px; }
        .file-name { font-size: 13px; word-break: break-all; height: 36px; overflow: hidden; color: #eee; line-height: 1.4; }
        #preview-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        #preview-content, #preview-video { max-width: 95%; max-height: 60%; border-radius: 8px; margin-bottom: 20px; display: none; box-shadow: 0 4px 30px rgba(0,0,0,0.5); }
        .modal-btns { display: flex; gap: 15px; width: 100%; max-width: 320px; }
        .btn { flex: 1; padding: 14px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-download { background: var(--primary-color); color: white; }
        .btn-close { background: #38383a; color: white; }
        .loading { margin-top: 50px; color: var(--text-sub); }
    </style>
</head>
<body>
    <header>
        <h1>阿丹時光膠囊</h1>
        <div id="status" class="status-bar">基地連線中...</div>
    </header>

    <div id="adan-gallery"></div>
    <div id="loading" class="loading">正在呈現基地...</div>

    <div id="preview-modal">
        <div id="preview-title" style="margin-bottom: 12px; font-weight: bold; text-align: center; width: 90%;"></div>
        <img id="preview-content" src="">
        <video id="preview-video" controls playsinline></video>
        <div id="file-meta" style="color: #8e8e93; font-size: 12px; margin-bottom: 25px;"></div>
        <div class="modal-btns">
            <button class="btn btn-close" onclick="closePreview()">關閉</button>
            <button id="real-download" class="btn btn-download">下載回憶</button>
        </div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        const API_URL = "https://adan-api.hanknah02.workers.dev";

        function getFileType(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) return 'image';
            if (['mp4', 'mov', 'webm'].includes(ext)) return 'video';
            return 'other';
        }

        function getIcon(filename) {
            const type = getFileType(filename);
            if (type === 'image') return '🖼️';
            if (type === 'video') return '🎥';
            return '📄';
        }

        async function openPreview(file) {
            try {
                const profile = await liff.getProfile();
                const modal = document.getElementById('preview-modal');
                const img = document.getElementById('preview-content');
                const video = document.getElementById('preview-video');
                const title = document.getElementById('preview-title');
                const meta = document.getElementById('file-meta');
                const dlBtn = document.getElementById('real-download');

                title.innerText = file.name;
                meta.innerText = `${file.size} | ${file.date}`;
                const url = `${API_URL}?userId=${profile.userId}&key=${encodeURIComponent(file.key)}`;
                const type = getFileType(file.name);

                img.style.display = 'none';
                video.style.display = 'none';
                video.src = "";

                if (type === 'image') {
                    img.src = url;
                    img.style.display = 'block';
                } else if (type === 'video') {
                    video.src = url;
                    video.style.display = 'block';
                    video.load();
                }

                dlBtn.onclick = () => { window.location.href = url + "&download=true"; };
                modal.style.display = 'flex';
            } catch (err) { console.error("Preview Error:", err); }
        }

        function closePreview() {
            const modal = document.getElementById('preview-modal');
            const video = document.getElementById('preview-video');
            modal.style.display = 'none';
            video.pause();
            video.src = "";
            document.getElementById('preview-content').src = "";
        }

        async function initAdan() {
            try {
                await liff.init({ liffId: "2009633088-LqIEGiJZ" });
                if (!liff.isLoggedIn()) { liff.login(); return; }
                const profile = await liff.getProfile();
                document.getElementById('status').innerText = `歡迎回來，${profile.displayName}`;

                const response = await fetch(`${API_URL}?userId=${profile.userId}`);
                const files = await response.json();
                document.getElementById('loading').style.display = 'none';
                
                const galleryEl = document.getElementById('adan-gallery');
                galleryEl.innerHTML = "";
                files.forEach(file => {
                    const card = document.createElement('div');
                    card.className = 'gallery-item';
                    card.onclick = () => openPreview(file);
                    card.innerHTML = `<div class="file-icon">${getIcon(file.name)}</div><div class="file-name">${file.name}</div>`;
                    galleryEl.appendChild(card);
                });
            } catch (err) { console.error("Init Error:", err); }
        }
        window.onload = initAdan;
    </script>
</body>
</html>
